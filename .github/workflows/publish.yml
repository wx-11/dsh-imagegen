name: Publish plugin

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate package metadata
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'))
          const { GITHUB_REF_TYPE: refType, GITHUB_REF_NAME: refName } = process.env
          console.log(`Package: ${name}@${version}; ref: ${refType}/${refName}`)
          if (name !== '@superdsh/dsh-imagegen') {
            console.error(`::error::Package name mismatch: expected @superdsh/dsh-imagegen, got ${name}`)
            process.exit(1)
          }
          if (refType === 'tag' && version !== refName?.replace(/^v/, '')) {
            console.error(`::error::Release tag ${refName} does not match package.json version ${version}. Expected tag: v${version}.`)
            process.exit(1)
          }
          console.log('Package metadata OK')
          NODE

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Verify publish contents
        run: node scripts/package-test.mjs

      - name: Verify npm publishing account
        run: |
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "::error::Configure the NPM_TOKEN repository secret with an npm publishing token."
            exit 1
          fi
          npm whoami --registry=https://registry.npmjs.org > /dev/null
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
