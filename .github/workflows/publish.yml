name: Publish plugin

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate package metadata
        run: |
          test "$(node -p "require('./package.json').name")" = "@superdsh/dsh-imagegen"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            test "$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME#v}"
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Verify npm publishing account
        run: |
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "::error::Configure the NPM_TOKEN repository secret with an npm publishing token."
            exit 1
          fi
          npm whoami --registry=https://registry.npmjs.org > /dev/null
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
